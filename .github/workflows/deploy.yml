name: Deploy Obsidian vault to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
          path: vault/
      - name: Checkout Quartz v4.5.2
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          path: quartz/
          ref: v4.5.2
      - name: Move configuration and layout to Quartz
        run: mv vault/quartz.*.ts quartz/
      - name: Remove license
        run: rm vault/LICENSE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
        working-directory: quartz/
      - name: Build Quartz
        run: npx quartz build --directory ../vault/
        working-directory: quartz/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
